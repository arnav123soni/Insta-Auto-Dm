# OpenReply (Instagram AutoDM) - Nginx Configuration Template
# For Oracle Cloud VM alongside Chemical CRM
#
# Usage:
# 1. Copy to /etc/nginx/sites-available/openreply
# 2. Symlink: sudo ln -s /etc/nginx/sites-available/openreply /etc/nginx/sites-enabled/
# 3. Test: sudo nginx -t
# 4. Obtain SSL: sudo certbot --nginx -d dm.yourdomain.com
# 5. Reload: sudo systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dm.yourdomain.com; # <-- Replace with your subdomain

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dm.yourdomain.com; # <-- Replace with your subdomain

    # SSL Certificates (managed automatically by certbot)
    # ssl_certificate /etc/letsencrypt/live/dm.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dm.yourdomain.com/privkey.pem;

    # Performance & Payload Buffers for Meta Webhooks
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Proxy to OpenReply container (localhost:3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for SSE / Long Polls / Background Webhook Processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
