name: openreply-prod

services:
  # 1. PostgreSQL Database (Internal only - no host port exposure to prevent clash with Chemical CRM)
  postgres:
    image: postgres:16-alpine
    container_name: openreply-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-openreply}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openreply}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Queue (Internal only)
  redis:
    image: redis:7-alpine
    container_name: openreply-prod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Next.js Web App (Bound to localhost:3001 so host Nginx reverse-proxies to it securely)
  web:
    build:
      context: .
      target: runner-web
    container_name: openreply-prod-web
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 to prevent direct unauthenticated external access bypassing Nginx/SSL
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CRON_SECRET=${CRON_SECRET:-${NEXTAUTH_SECRET}}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_in_production_db_password}@postgres:5432/${POSTGRES_DB:-openreply}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v25.0}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN:-openreply_webhook_verify_token}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - LOCAL_OWNER_ID=${LOCAL_OWNER_ID:-}
      - LOCAL_OWNER_EMAIL=${LOCAL_OWNER_EMAIL:-}
      - LOCAL_OWNER_NAME=${LOCAL_OWNER_NAME:-}
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Background BullMQ Worker (Handles DMs & Comment Processing)
  worker:
    build:
      context: .
      target: runner-worker
    container_name: openreply-prod-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_in_production_db_password}@postgres:5432/${POSTGRES_DB:-openreply}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v25.0}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Periodic Cron Scheduler (Token refresh, reconciliation, follower snapshots)
  cron:
    build:
      context: .
      target: runner-web
    container_name: openreply-prod-cron
    restart: unless-stopped
    entrypoint: ["sh", "scripts/cron.sh"]
    environment:
      - CRON_BASE_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET:-${NEXTAUTH_SECRET}}
    networks:
      - internal_net
    depends_on:
      - web

volumes:
  postgres_data:
    name: openreply_prod_postgres_data
  redis_data:
    name: openreply_prod_redis_data

networks:
  internal_net:
    name: openreply_prod_internal_net
